<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f3efe5">
  <title>Pajó Agenda</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="topbar"><div><span class="eyebrow">PAJÓ</span><h1>Agenda Digital</h1></div><button id="todayBtn">Hoje</button></header>
<nav class="tabs" aria-label="Vistas"><button class="tab active" data-view="day">Dia</button><button class="tab" data-view="month">Mês</button><button class="tab" data-view="year">Ano</button></nav>
<main>
<section id="dayView" class="view active"><div class="day-head"><button id="prevDay" aria-label="Dia anterior">‹</button><div><div id="dayWeek" class="day-week"></div><div class="date-line"><strong id="dayNumber"></strong><span id="dayMonthYear"></span></div></div><button id="nextDay" aria-label="Dia seguinte">›</button></div><div class="paper"><div class="section-title">Compromissos e tarefas</div><div id="tasks" class="tasks"></div><button id="addTask" class="add">+ Adicionar tarefa</button><div class="section-title notes-title">Notas do dia</div><textarea id="notes" class="lined-paper" placeholder="Escreve aqui..."></textarea><div id="saveState" class="save-state">Guardado automaticamente</div></div></section>
<section id="monthView" class="view"><div class="navigator"><button id="prevMonth">‹</button><h2 id="monthTitle"></h2><button id="nextMonth">›</button></div><div class="weekdays"><span>Seg</span><span>Ter</span><span>Qua</span><span>Qui</span><span>Sex</span><span>Sáb</span><span>Dom</span></div><div id="monthGrid" class="month-grid"></div></section>
<section id="yearView" class="view"><div class="navigator"><button id="prevYear">‹</button><h2 id="yearTitle"></h2><button id="nextYear">›</button></div><div id="yearGrid" class="year-grid"></div></section>
</main>
<footer>Os dados desta versão ficam guardados apenas neste browser.</footer><script src="app.js"></script>
</body></html>
